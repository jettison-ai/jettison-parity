[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jettison-parity"
version = "0.1.0"
description = "Parity Harness: benchmark suite for agent token optimizers (standing context, task parity, session cost, holdout RCT)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
parity = "parity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["parity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
